<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc"><title id="title">third 问题与修复思维导图</title><desc id="desc">从third中心向六个分支展开：现象、原因、修复、证据、风险、验收。E版设备一分钟通过，正式整体未验收。</desc><rect width="1600" height="1280" fill="#f6f8fa"/><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif}.leaf{font-size:17px;fill:#253545}.sub{font-size:14px;fill:#526273}.heading{font-size:20px;font-weight:600;fill:#1e3042}</style><path d="M660,640 C625.0,640 625.0,210 590,210" fill="none" stroke="#30799c" stroke-width="4"/><rect x="390" y="182" width="200" height="56" rx="9" fill="white" stroke="#30799c" stroke-width="2"/><text x="410" y="217" class="heading">用户现象</text><path d="M390,210 C365.0,210 365.0,106 340,106" fill="none" stroke="#30799c" stroke-width="2"/><rect x="20" y="69" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="34" y="102" class="leaf">开始慢、短按无效</text><text x="34" y="128" class="sub">monitor 同步等待，轮询有空窗</text><path d="M390,210 C365.0,210 365.0,210 340,210" fill="none" stroke="#30799c" stroke-width="2"/><rect x="20" y="173" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="34" y="206" class="leaf">日志成功，电脑看不到文件</text><text x="34" y="232" class="sub">先核查目录与真实写入 LBA</text><path d="M390,210 C365.0,210 365.0,314 340,314" fill="none" stroke="#30799c" stroke-width="2"/><rect x="20" y="277" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="34" y="310" class="leaf">文件损坏 / 文件无内容</text><text x="34" y="336" class="sub">不同阶段，不能混为同一原因</text><path d="M660,640 C625.0,640 625.0,640 590,640" fill="none" stroke="#a24c53" stroke-width="4"/><rect x="390" y="612" width="200" height="56" rx="9" fill="white" stroke="#a24c53" stroke-width="2"/><text x="410" y="647" class="heading">已确认机制</text><path d="M390,640 C365.0,640 365.0,536 340,536" fill="none" stroke="#a24c53" stroke-width="2"/><rect x="20" y="499" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="34" y="532" class="leaf">旧版兼容缺失 → 少 1024 扇区</text><text x="34" y="558" class="sub">数据区 15424，正确应为 16448</text><path d="M390,640 C365.0,640 365.0,640 340,640" fill="none" stroke="#a24c53" stroke-width="2"/><rect x="20" y="603" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="34" y="636" class="leaf">会话标识丢失 / 0x42 自动重建</text><text x="34" y="662" class="sub">同次检测多编号或覆盖历史</text><path d="M390,640 C365.0,640 365.0,744 340,744" fill="none" stroke="#a24c53" stroke-width="2"/><rect x="20" y="707" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="34" y="740" class="leaf">簇 0 误写 / D 探针干扰</text><text x="34" y="766" class="sub">FAT2 LBA16432；1E 窗口误读</text><path d="M660,640 C625.0,640 625.0,1070 590,1070" fill="none" stroke="#6a5b9a" stroke-width="4"/><rect x="390" y="1042" width="200" height="56" rx="9" fill="white" stroke="#6a5b9a" stroke-width="2"/><text x="410" y="1077" class="heading">修复过程</text><path d="M390,1070 C365.0,1070 365.0,966 340,966" fill="none" stroke="#6a5b9a" stroke-width="2"/><rect x="20" y="929" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="34" y="962" class="leaf">A 诊断 → B 兼容与回读</text><text x="34" y="988" class="sub">官方低版流程，禁止盲目加偏移</text><path d="M390,1070 C365.0,1070 365.0,1070 340,1070" fill="none" stroke="#6a5b9a" stroke-width="2"/><rect x="20" y="1033" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="34" y="1066" class="leaf">C 锁定会话 → D 写盘保护</text><text x="34" y="1092" class="sub">保留失败记录，D 不作为可用结论</text><path d="M390,1070 C365.0,1070 365.0,1174 340,1174" fill="none" stroke="#6a5b9a" stroke-width="2"/><rect x="20" y="1137" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="34" y="1170" class="leaf">E 移除交接期 READ_VAR</text><text x="34" y="1196" class="sub">保留预检、完成检查与关闭回读</text><path d="M940,640 C980.0,640 980.0,210 1020,210" fill="none" stroke="#357b61" stroke-width="4"/><rect x="1020" y="182" width="200" height="56" rx="9" fill="white" stroke="#357b61" stroke-width="2"/><text x="1040" y="217" class="heading">验证证据</text><path d="M1220,210 C1240.0,210 1240.0,106 1260,106" fill="none" stroke="#357b61" stroke-width="2"/><rect x="1260" y="69" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="1274" y="102" class="leaf">模型 94 项通过，真实构建成功</text><text x="1274" y="128" class="sub">模型不代表实际 U 盘落盘</text><path d="M1220,210 C1240.0,210 1240.0,210 1260,210" fill="none" stroke="#357b61" stroke-width="2"/><rect x="1260" y="173" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="1274" y="206" class="leaf">E：56 + 47 = 103 字节</text><text x="1274" y="232" class="sub">表头与第一分钟逐字节回读一致</text><path d="M1220,210 C1240.0,210 1240.0,314 1260,314" fill="none" stroke="#357b61" stroke-width="2"/><rect x="1260" y="277" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="1274" y="310" class="leaf">暂停 4820ms，有效 59980ms</text><text x="1274" y="336" class="sub">一个文件，仅一次 CREATE</text><path d="M940,640 C980.0,640 980.0,640 1020,640" fill="none" stroke="#9b702a" stroke-width="4"/><rect x="1020" y="612" width="200" height="56" rx="9" fill="white" stroke="#9b702a" stroke-width="2"/><text x="1040" y="647" class="heading">仍有风险</text><path d="M1220,640 C1240.0,640 1240.0,536 1260,536" fill="none" stroke="#9b702a" stroke-width="2"/><rect x="1260" y="499" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="1274" y="532" class="leaf">原 TXT 已删，多分钟待验</text><text x="1274" y="558" class="sub">未核对 E 电脑原字节及重插</text><path d="M1220,640 C1240.0,640 1240.0,640 1260,640" fill="none" stroke="#9b702a" stroke-width="2"/><rect x="1260" y="603" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="1274" y="636" class="leaf">写盘窗口 1313ms 暂停采集</text><text x="1274" y="662" class="sub">不能声称无丢滴或性能已达标</text><path d="M1220,640 C1240.0,640 1240.0,744 1260,744" fill="none" stroke="#9b702a" stroke-width="2"/><rect x="1260" y="707" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="1274" y="740" class="leaf">旧 FAT / 偶发 0x42 / 零进度</text><text x="1274" y="766" class="sub">保护不回滚，结构检查非全盘健康</text><path d="M940,640 C980.0,640 980.0,1070 1020,1070" fill="none" stroke="#426b9f" stroke-width="4"/><rect x="1020" y="1042" width="200" height="56" rx="9" fill="white" stroke="#426b9f" stroke-width="2"/><text x="1040" y="1077" class="heading">正式发布门槛</text><path d="M1220,1070 C1240.0,1070 1240.0,966 1260,966" fill="none" stroke="#426b9f" stroke-width="2"/><rect x="1260" y="929" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="1274" y="962" class="leaf">至少 3 分钟 + 两次暂停继续</text><text x="1274" y="988" class="sub">旧行保留；复位后下次才建新文件</text><path d="M1220,1070 C1240.0,1070 1240.0,1070 1260,1070" fill="none" stroke="#426b9f" stroke-width="2"/><rect x="1260" y="1033" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="1274" y="1066" class="leaf">电脑 TXT + 安全弹出重插</text><text x="1274" y="1092" class="sub">字节相符，完整文件系统无新增错</text><path d="M1220,1070 C1240.0,1070 1240.0,1174 1260,1174" fill="none" stroke="#426b9f" stroke-width="2"/><rect x="1260" y="1137" width="320" height="74" rx="7" fill="white" stroke="#ccd7e1"/><text x="1274" y="1170" class="leaf">另验采集精度与控制响应</text><text x="1274" y="1196" class="sub">通过后再决定合入正式 third</text><rect x="660" y="592" width="280" height="96" rx="12" fill="#1c3449"/><text x="800" y="632" text-anchor="middle" fill="white" font-size="25" font-family="Microsoft YaHei" font-weight="600">third 问题与修复</text><text x="800" y="663" text-anchor="middle" fill="#dce9f2" font-size="16" font-family="Microsoft YaHei">2026-10-12 ～ 15 · 当前测试 E</text><text x="30" y="45" class="heading">技术复盘 · 现象 / 根因 / 迭代 / 证据 / 边界 / 验收</text><text x="30" y="1230" class="leaf">结论：E 设备侧一次暂停继续与一分钟写入通过；正式 third 未替换，整体验收仍待完成。</text></svg>