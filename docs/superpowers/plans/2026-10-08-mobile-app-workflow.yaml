name: mobile-app-v1
agents_dir: mobile-app-roles
inputs:
  - name: approved
    required: true
  - name: workspace
    default: 'F:/ESP32/niaio/git'
  - name: plan
    default: 'docs/superpowers/plans/2026-10-08-mobile-app-work-plan.md'
# 审核稿：未获得人类批准不得执行。
# 由主智能体实际调度真实子智能体；同时活跃的Codex代理最多4个，含主代理。
# DSH通过主代理单一GUI入口调度，不在此文件假设不存在的DeepSeek API。
steps:
  - id: contract
    role: root-architecture
    task: '批准状态={{approved}}。先验证人类已批准；否则停止。依据{{workspace}}/{{plan}}完成P0，冻结协议、UI、文件所有权与基线，产生各组短任务包。'
    output: contract_result
  - id: network_spike
    role: firmware-lead
    depends_on: [contract]
    task: '依据冻结合同和{{workspace}}/{{plan}}，仅执行F0最小AP/WebSocket连通试验。建立负责人及必要的受限叶子任务；烧录由主代理核验授权后处理。'
    output: spike_result
  - id: compatibility
    role: android-lead
    depends_on: [contract, network_spike]
    task: '执行G0/E0，验证nova14实际APK安装、权限、本地Wi-Fi路由和WS连接。工具链与版本可重复；未通过不得启动大规模手机UI实现。'
    output: compatibility_result
  - id: firmware
    role: firmware-lead
    depends_on: [compatibility]
    task: '执行F1/F2/F3/F4。在并发槽与所有权范围内下达L2叶子任务，并做父级需求/质量审查；不改CH376驱动，不烧录。'
    output: firmware_result
  - id: android
    role: android-lead
    depends_on: [compatibility]
    task: '执行A1/A2。按冻结UI和协议安排L2任务；D1展示资源须由主代理经DSH派发。负责人负责连接和状态仓库，不占用叶子任务文件。'
    output: android_result
  - id: independent_review
    role: quality-lead
    depends_on: [firmware, android]
    task: '独立执行Q0/Q1及验收矩阵的软件检查。D2样例由主代理经DSH派发并由QA复核。报告必须修复项，失败退回原所有者，不改低门槛。'
    output: review_result
  - id: integration
    role: integration
    depends_on: [independent_review]
    task: '仅在审查问题关闭后执行I0。主代理审阅并接收每份diff，整合main/CMake/sdkconfig与Android版本，完成两端集成构建。'
    output: integration_result
  - id: device_acceptance
    role: device-validation
    depends_on: [integration]
    task: '执行H0，主代理与用户在明确的设备/镜像/授权范围内完成真机验收。PASS/FAIL/NOT_RUN/BLOCKED如实记录；不能把模拟U盘状态标成实测。'
    output: device_result
  - id: delivery
    role: delivery
    depends_on: [device_acceptance]
    task: '执行R0。主代理核对真实证据与限制，整理源码、APK、固件、校验摘要、协议和使用说明；D3文档可经DSH生成草稿后人工式核验。'
    output: delivery_result
